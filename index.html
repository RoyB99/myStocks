<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Stock Tracker Dashboard</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- TradingView Lightweight Charts (v4 API: addCandlestickSeries) -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="dashboard">
    <header>
      <h1>Market Dashboard</h1>
      <div class="controls">
        <input type="text" id="symbolInput" value="AAPL" maxlength="12" spellcheck="false" autocomplete="off" placeholder="Symbol e.g. AAPL" style="text-transform: uppercase;">
        <select id="intervalSelect" title="Chart interval">
          <option value="1day" selected>Daily</option>
          <option value="1h">Hourly</option>
          <option value="30min">30 min</option>
          <option value="15min">15 min</option>
        </select>
        <input type="password" id="apiKeyInput" placeholder="Twelve Data API key" autocomplete="off">
        <button id="loadBtn">Load Stock</button>
      </div>
      <p class="hint">Get a free key at <a href="https://twelvedata.com" target="_blank" rel="noopener">twelvedata.com</a>. Key is stored only in your browser (localStorage), never committed.</p>
    </header>

    <main>
      <div class="ticker-card">
        <h2 id="stockTitle">AAPL</h2>
        <div class="price-container">
          <span id="livePrice">--.--</span>
          <span id="priceChange"></span>
          <span id="statusBadge" class="badge">Init</span>
        </div>
        <div id="errorMsg" class="error" hidden></div>
      </div>

      <!-- Chart Canvas Container -->
      <div id="chartContainer"></div>
    </main>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/gate.js"></script>
  <script src="js/api.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
